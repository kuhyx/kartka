[project]
name = "kartka-source-eval"
version = "0.1.0"
description = "Measures manga sources (uptime, blocking, coverage, completeness, image quality) for Kartka"
requires-python = ">=3.15"
dependencies = [
    "crdt-sync @ git+https://github.com/kuhyx/utils@crdt-sync-v0.9.2#subdirectory=crdt-sync",
    "pillow==13.0.0",
    "rapidfuzz==3.14.6",
    "requests==2.34.2",
]

[project.scripts]
source-eval = "source_eval.cli:main"

[dependency-groups]
dev = [
    "hypothesis==6.170.14",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "types-requests==2.33.0.20261030",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=source_eval --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=100"

[tool.coverage.run]
source = ["source_eval"]

[tool.coverage.report]
exclude_also = ["^\\s*\\.\\.\\.$", "if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py315"
src = ["src", "tests"]
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "D", "FBT", "PLC0415", "PLR2004", "S101", "S104", "SLF001", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["source_eval"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.15"
strict = true
warn_unreachable = true
disallow_any_generics = true
extra_checks = true
ignore_missing_imports = true
show_error_codes = true
mypy_path = "src"
exclude = [".venv/"]
