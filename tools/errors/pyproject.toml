[project]
name = "kartka-errors"
version = "0.1.0"
description = "Collects Kartka's error reports from RTDB into fixme.md"
requires-python = ">=3.15"
dependencies = [
    "crdt-sync @ git+https://github.com/kuhyx/utils@crdt-sync-v0.9.2#subdirectory=crdt-sync",
]

[project.scripts]
kartka-errors = "kartka_errors.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=kartka_errors --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=100"

[tool.coverage.run]
source = ["kartka_errors"]

[tool.coverage.report]
exclude_also = ["^\\s*\\.\\.\\.$", "if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py315"
src = ["src", "tests"]
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG", "D", "EM101", "FBT", "INP001", "PLC0415", "PLR2004", "S101", "SLF001", "TRY003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["kartka_errors"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.15"
strict = true
warn_unreachable = true
disallow_any_generics = true
extra_checks = true
ignore_missing_imports = true
show_error_codes = true
mypy_path = "src"
exclude = [".venv/"]
