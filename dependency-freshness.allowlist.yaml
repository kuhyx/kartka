# Dependencies held below latest stable in this repo, and why. `transitive:`
# entries are predicates: they clear themselves when the blocker moves, so
# they carry no `expires`.

exceptions:
  - ecosystem: toolchain
    package: flutter
    pinned: "3.47.9"
    reason: >-
      Flutter 3.50.0 deprecates package:flutter/material.dart for
      package:material_ui, a separate copy of the types: 198
      deprecated_member_use infos fail `analyze --fatal-infos`, and swapping
      the imports breaks app.dart (design_system 0.3.1 returns flutter's
      ThemeData) while sync_settings_ui's Theme.of would silently miss a
      material_ui theme. design_system and sync_settings_ui (kuhyx/utils)
      must move to material_ui first.
    blocked_by: "migration:kuhyx/utils design_system + sync_settings_ui to material_ui"
    expires: "2026-12-12"
